<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" fill="none" role="img" aria-label="Japanese agricultural tractor">
  <defs>
    <linearGradient id="bodyMetal" x1="40" y1="20" x2="220" y2="140" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F2C94C"/>
      <stop offset="0.45" stop-color="#D4A017"/>
      <stop offset="1" stop-color="#8B6914"/>
    </linearGradient>
    <linearGradient id="cabinGlass" x1="120" y1="30" x2="180" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8F4FF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#7BA3C4" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="tire" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#2A2A2A"/>
      <stop offset="1" stop-color="#111"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#14231C" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="140" cy="148" rx="98" ry="8" fill="#14231C" opacity="0.22"/>

  <g filter="url(#softShadow)">
    <!-- chassis -->
    <path d="M58 98 H210 C222 98 230 90 232 78 L238 58 C240 52 236 48 230 48 H168 L152 34 H118 L98 48 H72 C64 48 58 54 58 62 V98Z" fill="url(#bodyMetal)"/>
    <path d="M72 48 H98 L110 36 H148 L160 48" stroke="#F7E7A3" stroke-width="2" opacity="0.55"/>

    <!-- engine hood detail -->
    <rect x="70" y="56" width="52" height="28" rx="4" fill="#B8860B" opacity="0.55"/>
    <rect x="76" y="62" width="18" height="4" rx="1" fill="#F7E7A3" opacity="0.45"/>
    <rect x="76" y="70" width="28" height="3" rx="1" fill="#F7E7A3" opacity="0.35"/>

    <!-- cabin -->
    <path d="M118 34 H152 L168 52 H188 V86 H118 V34Z" fill="url(#bodyMetal)"/>
    <path d="M124 40 H148 L160 54 H180 V78 H124 V40Z" fill="url(#cabinGlass)"/>
    <path d="M124 40 V78 M152 40 L160 54 V78" stroke="#0F4C3A" stroke-opacity="0.25" stroke-width="1.5"/>

    <!-- seat hint -->
    <rect x="132" y="66" width="18" height="12" rx="2" fill="#3D2914" opacity="0.55"/>

    <!-- exhaust -->
    <rect x="96" y="28" width="6" height="22" rx="2" fill="#4A4A4A"/>
    <rect x="94" y="24" width="10" height="6" rx="2" fill="#333"/>

    <!-- headlight -->
    <circle cx="66" cy="72" r="6" fill="#FFF6D6"/>
    <circle cx="66" cy="72" r="3.5" fill="#FFE28A"/>

    <!-- front linkage / tiller arms -->
    <path d="M232 78 H252 L258 96 H238" stroke="#5C4033" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="258" cy="100" r="10" fill="#3D2914"/>
    <circle cx="258" cy="100" r="4" fill="#D4AF37"/>

    <!-- rear hitch -->
    <path d="M58 90 H42" stroke="#5C4033" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- rear wheel -->
  <g id="wheel-rear" transform="translate(78 112)">
    <circle r="30" fill="url(#tire)"/>
    <circle r="22" fill="#1A1A1A"/>
    <circle r="10" fill="#C9A227"/>
    <circle r="4" fill="#F7E7A3"/>
    <g stroke="#444" stroke-width="3">
      <line x1="0" y1="-20" x2="0" y2="20"/>
      <line x1="-20" y1="0" x2="20" y2="0"/>
      <line x1="-14" y1="-14" x2="14" y2="14"/>
      <line x1="14" y1="-14" x2="-14" y2="14"/>
    </g>
  </g>

  <!-- front wheel -->
  <g id="wheel-front" transform="translate(200 118)">
    <circle r="22" fill="url(#tire)"/>
    <circle r="15" fill="#1A1A1A"/>
    <circle r="7" fill="#C9A227"/>
    <circle r="3" fill="#F7E7A3"/>
    <g stroke="#444" stroke-width="2.5">
      <line x1="0" y1="-14" x2="0" y2="14"/>
      <line x1="-14" y1="0" x2="14" y2="0"/>
      <line x1="-10" y1="-10" x2="10" y2="10"/>
      <line x1="10" y1="-10" x2="-10" y2="10"/>
    </g>
  </g>
</svg>
